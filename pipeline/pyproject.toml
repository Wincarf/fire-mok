[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asf-search>=14.1.0",
    "fastapi>=0.162.7",
    "geopandas>=1.2.0",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.9.1",
    "pytest>=9.2.0",
    "rasterio>=1.5.2",
    "rio-tiler>=9.4.13",
    "titiler-core>=2.4.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
